version: '3.9'

services:
  postgres:
    image: postgres:18beta3-alpine # Fresh Updates from the Postgres !
    container_name: db
    hostname: postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass_123
      POSTGRES_DB: app_db
    healthcheck:
      test: ['CMD-SHELL', "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [cdc]

volumes:
  db-data:

networks:
  cdc:
    enable_ipv6: true
    driver: bridge